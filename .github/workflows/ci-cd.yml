name: Shri Shyam Properties CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. ADMIN NEXT.JS APP CI/CD BUILD
  build-admin:
    name: Build & Verify Admin Panel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./admin/package-lock.json

      - name: Install Admin Dependencies
        run: npm ci

      - name: Type Check & Verify Next.js Build
        run: |
          npx tsc --noEmit
          npm run build

  # 2. FRONTEND PUBLIC SITE CI/CD BUILD
  build-frontend:
    name: Build & Verify Public Site (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check & Verify Next.js Build
        run: |
          npx tsc --noEmit
          npm run build

  # 3. BACKEND JAVA SPRING BOOT CI/CD BUILD
  build-backend:
    name: Build & Package Backend (Spring Boot JAR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Package Spring Boot Application JAR
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi

      - name: Upload Backend Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # 4. AUTO DEPLOY TO HOSTINGER VPS
  deploy-vps:
    name: Deploy to Hostinger VPS
    needs: [build-admin, build-frontend, build-backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment on Hostinger VPS..."
            cd /var/www/shrishyamproperties
            git reset --hard HEAD
            git pull origin main

            echo "🌐 Building & Restarting Frontend..."
            cd /var/www/shrishyamproperties/frontend
            npm install --prefer-offline --no-audit
            npm run build
            pm2 restart shrishyam-frontend || pm2 start npm --name "shrishyam-frontend" -- start -- -p 3000

            echo "⚙️ Building & Restarting Admin Dashboard..."
            cd /var/www/shrishyamproperties/admin
            npm install --prefer-offline --no-audit
            npm run build
            pm2 restart shrishyam-admin || pm2 start npm --name "shrishyam-admin" -- start -- -p 3001

            echo "📦 Checking Backend Status..."
            pm2 restart shrishyam-backend || true

            pm2 save
            echo "✅ Hostinger VPS Deployment Finished Successfully!"

