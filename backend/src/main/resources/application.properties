spring.application.name=ShriShyamPropertiesBackend
server.port=${PORT:8080}

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shrishyam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:54321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Database Seeds Initialization Mode (never by default in production to protect existing data)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# JWT Configuration Secret Key
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Max Size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

